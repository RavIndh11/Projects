version: '3.8'

services:
  cloudtrail-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudtrail-hunter
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    restart: unless-stopped
    networks:
      - ct-network

networks:
  ct-network:
    driver: bridge
