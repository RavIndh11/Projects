<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Upload Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center">
                <svg class="w-8 h-8 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                Secure Upload Gateway
            </h1>
            <p class="text-gray-600 mt-2">Real-time security analyzer for file uploads. Protects against extension spoofing, Zip Slip, and malicious payloads.</p>
        </header>

        <main>
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Upload File for Analysis</h2>

                <form id="uploadForm" class="space-y-4">
                    <div class="flex items-center justify-center w-full">
                        <label for="fileInput" class="flex flex-col items-center justify-center w-full h-48 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-gray-500">Supported formats: TXT, CSV, PDF, JPG, PNG, ZIP, JSON (Max 50MB)</p>
                            </div>
                            <input id="fileInput" type="file" class="hidden" />
                        </label>
                    </div>
                    <div id="selectedFileName" class="text-sm text-gray-600 font-medium hidden"></div>
                    <button type="submit" id="analyzeBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Analyze File</button>
                </form>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden flex justify-center items-center py-8">
                <div class="loader"></div>
                <span class="ml-3 text-gray-600">Analyzing file...</span>
            </div>

            <!-- Results Section -->
            <div id="resultSection" class="hidden bg-white rounded-lg shadow-md overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200" id="resultHeader">
                    <h3 class="text-lg font-semibold flex items-center justify-between">
                        Analysis Results
                        <span id="statusBadge" class="px-3 py-1 text-xs font-bold rounded-full"></span>
                    </h3>
                </div>

                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h4 class="text-sm font-semibold text-gray-500 uppercase mb-2">File Details</h4>
                            <ul class="space-y-2 text-sm text-gray-700">
                                <li><strong>Detected MIME:</strong> <span id="resMime"></span></li>
                                <li><strong>Extension:</strong> <span id="resExt"></span></li>
                                <li><strong>Size:</strong> <span id="resSize"></span> bytes</li>
                                <li><strong>Risk Score:</strong> <span id="resScore" class="font-bold"></span></li>
                            </ul>
                        </div>
                    </div>

                    <div id="threatsContainer" class="hidden">
                        <h4 class="text-sm font-semibold text-red-600 uppercase mb-2">Threats Found</h4>
                        <ul id="threatsList" class="list-disc list-inside text-sm text-red-700 space-y-1 bg-red-50 p-4 rounded-md">
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const selectedFileName = document.getElementById('selectedFileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFileName.textContent = `Selected: ${e.target.files[0].name}`;
                selectedFileName.classList.remove('hidden');
            } else {
                selectedFileName.classList.add('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file to analyze.');
                return;
            }

            // UI state
            analyzeBtn.disabled = true;
            loading.classList.remove('hidden');
            resultSection.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/v1/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                alert(`Error analyzing file: ${error.message}`);
            } finally {
                analyzeBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        function displayResults(data) {
            const statusBadge = document.getElementById('statusBadge');
            const resultHeader = document.getElementById('resultHeader');
            const threatsContainer = document.getElementById('threatsContainer');
            const threatsList = document.getElementById('threatsList');

            // Populate Details
            document.getElementById('resMime').textContent = data.file_type;
            document.getElementById('resExt').textContent = data.details.extension || 'None';
            document.getElementById('resSize').textContent = data.details.file_size_bytes.toLocaleString();
            document.getElementById('resScore').textContent = data.risk_score;

            // Status Badge & Colors
            if (data.is_safe) {
                statusBadge.textContent = 'SAFE';
                statusBadge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800';
                resultHeader.className = 'px-6 py-4 border-b border-gray-200 bg-green-50';
                document.getElementById('resScore').className = 'font-bold text-green-600';
                threatsContainer.classList.add('hidden');
            } else {
                statusBadge.textContent = data.risk_score >= 100 ? 'CRITICAL' : 'WARNING';
                statusBadge.className = `px-3 py-1 text-xs font-bold rounded-full ${data.risk_score >= 100 ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}`;
                resultHeader.className = `px-6 py-4 border-b border-gray-200 ${data.risk_score >= 100 ? 'bg-red-50' : 'bg-yellow-50'}`;
                document.getElementById('resScore').className = `font-bold ${data.risk_score >= 100 ? 'text-red-600' : 'text-yellow-600'}`;

                // Populate Threats
                threatsList.innerHTML = '';
                data.threats_found.forEach(threat => {
                    const li = document.createElement('li');
                    li.textContent = threat;
                    threatsList.appendChild(li);
                });
                threatsContainer.classList.remove('hidden');
            }

            resultSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
