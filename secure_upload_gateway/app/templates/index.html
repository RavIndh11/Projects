<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Upload Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .severity-low { @apply bg-green-100 text-green-800; }
        .severity-high { @apply bg-yellow-100 text-yellow-800; }
        .severity-critical { @apply bg-red-100 text-red-800; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Secure Upload Gateway</h1>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">SOC Tool</span>
        </div>

        <p class="text-gray-600 mb-6 text-sm">
            Upload files for security analysis. The gateway detects extension spoofing, embedded polyglot payloads, and Zip Slip vulnerabilities.
        </p>

        <form id="uploadForm" class="space-y-4">
            <div class="flex items-center justify-center w-full">
                <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    </div>
                    <input id="fileInput" type="file" class="hidden" required />
                </label>
            </div>

            <button type="submit" id="submitBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                Analyze File
            </button>
            <div id="loading" class="hidden text-center text-gray-500 text-sm mt-2">Analyzing...</div>
        </form>

        <div id="results" class="mt-8 hidden">
            <h2 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">Analysis Report</h2>

            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 text-sm font-medium">Filename:</span>
                    <span id="resFilename" class="text-gray-900 text-sm font-mono break-all"></span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-600 text-sm font-medium">Status:</span>
                    <span id="resStatus" class="text-sm font-bold uppercase"></span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-600 text-sm font-medium">Severity:</span>
                    <span id="resSeverity" class="text-xs font-semibold px-2.5 py-0.5 rounded uppercase"></span>
                </div>
            </div>

            <div id="threatContainer" class="mt-4 hidden">
                <span class="text-gray-600 text-sm font-medium block mb-2">Detected Threats:</span>
                <ul id="threatList" class="space-y-2">
                    <!-- Threats injected here -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            results.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Introduced intentional delay for UI testing with Playwright
                // This ensures the loading state is visible during test execution
                await new Promise(r => setTimeout(r, 500));

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Upload failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        });

        function displayResults(data) {
            const results = document.getElementById('results');
            results.classList.remove('hidden');

            document.getElementById('resFilename').textContent = data.filename;

            const statusEl = document.getElementById('resStatus');
            statusEl.textContent = data.status;
            statusEl.className = `text-sm font-bold uppercase ${data.status === 'clean' ? 'text-green-600' : 'text-red-600'}`;

            const severityEl = document.getElementById('resSeverity');
            severityEl.textContent = data.severity;
            severityEl.className = `text-xs font-semibold px-2.5 py-0.5 rounded uppercase severity-${data.severity}`;

            const threatContainer = document.getElementById('threatContainer');
            const threatList = document.getElementById('threatList');
            threatList.innerHTML = '';

            if (data.threats && data.threats.length > 0) {
                threatContainer.classList.remove('hidden');
                data.threats.forEach(threat => {
                    const li = document.createElement('li');
                    li.className = 'p-3 rounded bg-red-50 border border-red-200';
                    li.innerHTML = `
                        <div class="font-bold text-red-800 text-sm mb-1">${threat.type.replace('_', ' ').toUpperCase()}</div>
                        <div class="text-red-600 text-xs">${threat.description}</div>
                    `;
                    threatList.appendChild(li);
                });
            } else {
                threatContainer.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
