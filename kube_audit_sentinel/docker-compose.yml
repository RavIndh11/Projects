version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kube_audit_sentinel:latest
    container_name: kube_audit_sentinel
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  sentinel_net:
    driver: bridge
