version: "3.8"

services:
  mfa-fatigue-hunter:
    build: .
    container_name: mfa-fatigue-hunter
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-default-dev-key}
    restart: unless-stopped
    networks:
      - mfa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  mfa-net:
    driver: bridge