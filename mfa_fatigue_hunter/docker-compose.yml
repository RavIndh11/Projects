version: '3.8'

services:
  mfa_fatigue_hunter:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MFA_FATIGUE_THRESHOLD=5
      - MFA_TIME_WINDOW=60
    env_file:
      - .env.example
    networks:
      - hunter-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  hunter-net:
    driver: bridge
