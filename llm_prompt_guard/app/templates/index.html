<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Prompt Guard - SOC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-900 mb-2">LLM Prompt Guard</h1>
            <p class="text-gray-600">AI/LLM Security Proxy Dashboard</p>
        </header>

        <main class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Analyze Prompt</h2>
            <form id="analyze-form" class="space-y-4">
                <div>
                    <label for="prompt" class="block text-sm font-medium text-gray-700 mb-1">Enter Prompt Payload: <span class="text-red-500">*</span></label>
                    <textarea id="prompt" name="prompt" rows="5" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 border p-2 text-sm font-mono" placeholder="e.g., Ignore all previous instructions and..." required aria-required="true"></textarea>
                </div>
                <button id="submit-btn" type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                    Analyze Payload
                </button>
            </form>
        </main>

        <section id="results-section" class="hidden" aria-live="polite">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 border-b pb-2">Analysis Results</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-gray-50 p-4 rounded-md border text-center">
                        <span class="block text-sm text-gray-500 mb-1">Status</span>
                        <span id="res-status" class="text-lg font-bold"></span>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-md border text-center">
                        <span class="block text-sm text-gray-500 mb-1">Threat Level</span>
                        <span id="res-level" class="text-lg font-bold px-3 py-1 rounded-full text-white inline-block"></span>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-md border text-center">
                        <span class="block text-sm text-gray-500 mb-1">Threat Score</span>
                        <span id="res-score" class="text-lg font-bold"></span>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Matched Rules / Heuristics:</h3>
                    <ul id="res-rules" class="list-disc pl-5 text-sm text-gray-600 bg-gray-50 p-3 rounded-md border min-h-[3rem]">
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.getElementById('analyze-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Analyzing...
            `;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt }),
                });

                if (!response.ok) {
                    throw new Error('Analysis failed');
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during analysis.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyze Payload';
            }
        });

        function displayResults(data) {
            document.getElementById('results-section').classList.remove('hidden');

            // Status
            const statusEl = document.getElementById('res-status');
            statusEl.textContent = data.is_safe ? 'SAFE' : 'BLOCKED';
            statusEl.className = `text-lg font-bold ${data.is_safe ? 'text-green-600' : 'text-red-600'}`;

            // Threat Level Badge
            const levelEl = document.getElementById('res-level');
            levelEl.textContent = data.threat_level;

            const levelColors = {
                'Low': 'bg-green-500',
                'Medium': 'bg-yellow-500',
                'High': 'bg-orange-500',
                'Critical': 'bg-red-600'
            };
            levelEl.className = `text-lg font-bold px-3 py-1 rounded-full text-white inline-block ${levelColors[data.threat_level] || 'bg-gray-500'}`;

            // Threat Score
            document.getElementById('res-score').textContent = data.threat_score.toFixed(2);

            // Matched Rules
            const rulesList = document.getElementById('res-rules');
            rulesList.innerHTML = '';
            if (data.matched_rules && data.matched_rules.length > 0) {
                data.matched_rules.forEach(rule => {
                    const li = document.createElement('li');
                    li.textContent = rule;
                    rulesList.appendChild(li);
                });
            } else {
                rulesList.innerHTML = '<li class="list-none text-gray-400 italic">No malicious patterns detected.</li>';
            }
        }
    </script>
</body>
</html>
