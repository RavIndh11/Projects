version: '3.8'

services:
  llm_prompt_guard:
    build: .
    container_name: llm_prompt_guard
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    networks:
      - guard_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false

networks:
  guard_network:
    driver: bridge
