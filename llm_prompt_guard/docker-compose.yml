version: '3.8'

services:
  prompt-guard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-prompt-guard
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env
    networks:
      - guard-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Drop unnecessary capabilities
    cap_drop:
      - ALL

networks:
  guard-network:
    driver: bridge
