<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-safe { @apply bg-green-100 border-green-400 text-green-700; }
        .result-danger { @apply bg-red-100 border-red-400 text-red-700; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
            <svg class="w-8 h-8 mr-3 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            GraphQL Security Inspector
        </h1>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Analyze Query</h2>
            <form id="inspectForm" class="space-y-4">
                <div>
                    <label for="queryInput" class="block text-sm font-medium text-gray-700 mb-1">GraphQL Query</label>
                    <textarea id="queryInput" rows="6" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-sm" placeholder="query { ... }" required aria-label="GraphQL Query Input"></textarea>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center" aria-label="Analyze Query">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Analyze
                </button>
            </form>
        </div>

        <div id="resultContainer" class="hidden">
            <h3 class="text-lg font-semibold mb-3">Analysis Result</h3>
            <div id="resultBox" class="border px-4 py-3 rounded relative" role="alert">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="statusBadge" class="font-bold text-lg mb-2 block"></span>
                        <ul id="findingsList" class="list-disc pl-5 mt-2 mb-3"></ul>
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-opacity-20 border-gray-500 grid grid-cols-3 gap-4 text-sm">
                    <div><strong>Max Depth:</strong> <span id="metricDepth"></span></div>
                    <div><strong>Aliases:</strong> <span id="metricAliases"></span></div>
                    <div><strong>Introspection:</strong> <span id="metricIntro"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('inspectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('queryInput').value;

            try {
                const response = await fetch('/api/inspect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                const result = await response.json();
                displayResult(result);
            } catch (error) {
                console.error('Error:', error);
                alert('Error analyzing query');
            }
        });

        function displayResult(result) {
            const container = document.getElementById('resultContainer');
            const box = document.getElementById('resultBox');
            const statusBadge = document.getElementById('statusBadge');
            const findingsList = document.getElementById('findingsList');

            container.classList.remove('hidden');

            box.classList.remove('result-safe', 'result-danger');
            findingsList.innerHTML = '';

            if (result.is_safe) {
                box.classList.add('result-safe');
                statusBadge.textContent = '✓ Safe';
                findingsList.innerHTML = '<li>No security risks detected.</li>';
            } else {
                box.classList.add('result-danger');
                statusBadge.textContent = '⚠ Vulnerabilities Detected';
                result.findings.forEach(finding => {
                    const li = document.createElement('li');
                    li.textContent = finding;
                    findingsList.appendChild(li);
                });
            }

            document.getElementById('metricDepth').textContent = result.metrics.depth;
            document.getElementById('metricAliases').textContent = result.metrics.aliases;
            document.getElementById('metricIntro').textContent = result.metrics.has_introspection ? 'Yes' : 'No';
        }
    </script>
</body>
</html>
