version: '3.8'

services:
  ssrf_sentinel:
    build: .
    container_name: ssrf_sentinel
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    restart: unless-stopped
    networks:
      - sentinel_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  sentinel_net:
    driver: bridge
