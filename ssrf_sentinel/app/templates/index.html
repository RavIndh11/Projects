<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSRF Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 max-w-4xl">
        <h1 class="text-3xl font-bold mb-6 text-blue-800">SSRF Sentinel</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Fetch URL Securely</h2>
            <form action="/fetch" method="post" class="flex gap-4">
                <input type="url" name="url" placeholder="https://example.com" required
                       class="flex-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       value="{{ url if url else '' }}">
                <button type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
                    Fetch
                </button>
            </form>
        </div>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p class="font-bold">Error</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        {% if status_code %}
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Response</h2>

            <div class="mb-4 flex items-center gap-2">
                <span class="font-bold">Status:</span>
                <span class="px-2 py-1 rounded text-sm font-semibold
                    {% if status_code < 300 %}bg-green-100 text-green-800
                    {% elif status_code < 400 %}bg-blue-100 text-blue-800
                    {% else %}bg-red-100 text-red-800{% endif %}">
                    {{ status_code }}
                </span>
            </div>

            <div class="mb-4">
                <h3 class="font-bold text-gray-700 mb-2">Headers</h3>
                <div class="bg-gray-50 p-4 rounded overflow-x-auto text-sm font-mono">
                    {% for key, value in headers.items() %}
                        <div><span class="text-blue-600">{{ key }}:</span> {{ value }}</div>
                    {% endfor %}
                </div>
            </div>

            <div>
                <h3 class="font-bold text-gray-700 mb-2">Content Preview (First 2000 chars)</h3>
                <pre class="bg-gray-50 p-4 rounded overflow-x-auto text-sm whitespace-pre-wrap font-mono">{{ content }}</pre>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
